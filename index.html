<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ping</title>
</head>
<body>
  Ping started.

  <script>
    const TARGET_URL = "https://fb3917005fb6c1f2a8e0gife5oeyyyyyb.oast.site";
    const TOTAL_REQUESTS = 10;

    // Immediately dispatch all 10 requests in parallel
    for (let i = 0; i < TOTAL_REQUESTS; i++) {
      fetch(TARGET_URL, {
        method: "GET",
        mode: "no-cors",
        cache: "no-store",
        keepalive: true
      }).catch(() => {});
    }
  </script>
</body>
</html>
