<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Fetcher</title>
</head>
<body>
    <h1>Fetching URL 10 times...</h1>
    <ul id="log"></ul>

    <script>
        const targetUrl = 'https://fb3917005fb6c1f2a8e0gife5oeyyyyyb.oast.site';
        const fetchCount = 100;
        const logList = document.getElementById('log');

        function appendLog(message) {
            const li = document.createElement('li');
            li.textContent = message;
            logList.appendChild(li);
        }

        async function sendRequests() {
            const requests = [];

            for (let i = 1; i <= fetchCount; i++) {
                // Sending requests concurrently
                const request = fetch(targetUrl, { mode: 'no-cors' })
                    .then(response => {
                        appendLog(`Request #${i}: Completed (Status: ${response.type})`);
                    })
                    .catch(error => {
                        appendLog(`Request #${i}: Failed (${error.message})`);
                    });
                
                requests.push(request);
            }

            await Promise.allSettled(requests);
            appendLog('All 10 requests executed.');
        }

        document.addEventListener('DOMContentLoaded', sendRequests);
    </script>
</body>
</html>
